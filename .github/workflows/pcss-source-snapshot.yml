name: PCSS source snapshot

on:
  push:
    branches: [feature/pcss-editor-gcode-shadows]
    paths: [.github/workflows/pcss-source-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    if: github.repository == 'PILIPALA030/OrcaSlicer' && github.ref == 'refs/heads/feature/pcss-editor-gcode-shadows'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Package tracked source files only
        shell: python
        run: |
          import json, pathlib, subprocess, zipfile
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          roots = ('src/', 'cmake/', 'resources/shaders/', 'tests/', 'deps/', '.github/', 'doc/')
          root_files = {'CMakeLists.txt', 'AGENTS.md', '.clang-format', '.gitmodules'}
          with zipfile.ZipFile('pcss-source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in paths:
                  p = pathlib.Path(name)
                  if p.is_file() and (name.startswith(roots) or name in root_files or (len(p.parts) == 1 and p.suffix in {'.cmake', '.sh'})):
                      archive.write(p, name)
              archive.writestr('PCSS_SOURCE_METADATA.json', json.dumps({'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip(), 'base': 'b3417d7a66d76b4de392b84894426d376f020a6b'}, indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: pcss-source-snapshot
          path: pcss-source.zip
          retention-days: 3
          if-no-files-found: error
