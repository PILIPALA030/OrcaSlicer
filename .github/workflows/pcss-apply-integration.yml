name: PCSS apply integration
on:
  push:
    branches: [feature/pcss-editor-gcode-shadows]
    paths: [.github/workflows/pcss-apply-integration.yml]
permissions:
  contents: read
concurrency:
  group: pcss-reviewed-integration
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'PILIPALA030/OrcaSlicer' && github.ref == 'refs/heads/feature/pcss-editor-gcode-shadows'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify and reconstruct the reviewed patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, gzip, hashlib, json, pathlib, subprocess
          blobs = ['b0b4254edbfc7a12e326078b1b1345e099e3b895', '3d9b23df7cbc4461762002b72e64506db216b01d', 'b2191563d567b8fc1c5f7d152981e668490625fb', '327367006d68a09d4f3cbb006c1de910afeffc8a']
          chunks = []
          for index, sha in enumerate(blobs):
              obj = json.loads(subprocess.check_output(['gh', 'api', 'repos/PILIPALA030/OrcaSlicer/git/blobs/' + sha]))
              data = base64.b64decode(obj['content'])
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual == sha, 'Blob checksum mismatch'
              text = base64.b64encode(data).decode() if index == 0 else data.decode()
              if index == 0:
                  # Correct three transfer-only character errors observed by a read-only round trip.
                  for begin, end, replacement in [(10314, 10316, 'Z'), (4671, 4673, ''), (4355, 4356, '')]:
                      text = text[:begin] + replacement + text[end:]
              assert len(text) == 10312
              chunks.append(text)
          patch = gzip.decompress(base64.b64decode(''.join(chunks), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'ee3f71b21e3a37e9209fb0bbf30433a9bfb9119c60bf9c1102ad20d720eafe2c', 'Reviewed source checksum mismatch'
          pathlib.Path('/tmp/pcss-reviewed.mbox').write_bytes(patch)
      - name: Apply five English commits without changing main
        run: |
          git merge-base --is-ancestor b3417d7a66d76b4de392b84894426d376f020a6b HEAD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git am /tmp/pcss-reviewed.mbox
          git diff --check b3417d7a66d76b4de392b84894426d376f020a6b..HEAD
          git log -5 --format='%h %s'
      - name: Install isolated OpenGL test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libglew-dev libglfw3-dev libgl1-mesa-dev xvfb xauth ninja-build
      - name: Build and test the shipping renderer
        run: |
          set -o pipefail
          mkdir -p validation-logs
          cmake -S tests/pcss -B build-pcss -G Ninja -DPCSS_TEST_OPENGL=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS='-Wall -Wextra -Werror -pedantic' 2>&1 | tee validation-logs/configure.log
          cmake --build build-pcss --parallel 2 2>&1 | tee validation-logs/build.log
          LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=3.1 MESA_GLSL_VERSION_OVERRIDE=140 xvfb-run -a ctest --test-dir build-pcss --output-on-failure -V 2>&1 | tee validation-logs/opengl31.log
          LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=3.3 MESA_GLSL_VERSION_OVERRIDE=330 xvfb-run -a ctest --test-dir build-pcss --output-on-failure -V 2>&1 | tee validation-logs/opengl33.log
      - name: Fast-forward only the isolated feature branch
        id: publish
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          branch=feature/pcss-editor-gcode-shadows
          remote_head=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$remote_head" = "$EXPECTED_HEAD" || { echo 'Concurrent branch update; refusing to overwrite'; exit 1; }
          git push origin "HEAD:refs/heads/$branch"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git log -5 --format='%H %s' > validation-logs/commits.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pcss-native-validation
          path: validation-logs
          retention-days: 14
          if-no-files-found: warn
  host-build:
    needs: apply
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.commit }}
          persist-credentials: false
      - name: Restore existing slicer dependencies without creating a cache
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: deps/build/destdir
          key: ubuntu-24.04-cache-orcaslicer_deps-build-${{ hashFiles('deps/**') }}
      - name: Install GUI configure dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libboost-all-dev libtbb-dev libcereal-dev libnlopt-dev libnlopt-cxx-dev libopenvdb-dev libeigen3-dev libwxgtk3.2-dev libwxgtk-webview3.2-dev libgtk-3-dev libglew-dev libglfw3-dev libglu1-mesa-dev libdbus-1-dev libcurl4-openssl-dev libssl-dev libfreetype-dev libpng-dev zlib1g-dev libexpat1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libsecret-1-dev libwebkit2gtk-4.1-dev
      - name: Configure the actual GUI target
        run: |
          set -o pipefail
          mkdir -p host-validation
          args=(-DSLIC3R_STATIC=OFF)
          if test -d deps/build/destdir/usr/local; then
            args=(-DSLIC3R_STATIC=ON "-DCMAKE_PREFIX_PATH=$PWD/deps/build/destdir/usr/local")
          fi
          cmake -S . -B build-pcss-host -G Ninja -DCMAKE_BUILD_TYPE=Release -DSLIC3R_GUI=ON -DSLIC3R_GTK=3 -DSLIC3R_PCH=OFF -DSLIC3R_SENTRY=OFF -DSLIC3R_BUILD_TESTS=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON "${args[@]}" 2>&1 | tee host-validation/configure.log
      - name: Compile every modified GUI translation unit
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee host-validation/compile.log
          import json, pathlib, subprocess
          changed = {'PCSSShadowRenderer.cpp', 'GLCanvas3D.cpp', 'GLShadersManager.cpp', 'GCodeViewer.cpp', 'PartPlate.cpp', 'Preferences.cpp', '3DScene.cpp', 'AppConfig.cpp'}
          commands = json.loads(pathlib.Path('build-pcss-host/compile_commands.json').read_text())
          selected = [entry for entry in commands if pathlib.Path(entry['file']).name in changed]
          assert {pathlib.Path(e['file']).name for e in selected} == changed
          for entry in selected:
              print('COMPILE', entry['file'], flush=True)
              subprocess.run(entry['command'], cwd=entry['directory'], shell=True, check=True)
          print('All modified host translation units compiled. Full linking and interactive GUI acceptance are separate checks.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pcss-host-build-validation
          path: |
            host-validation
            build-pcss-host/CMakeCache.txt
          retention-days: 14
          if-no-files-found: warn
