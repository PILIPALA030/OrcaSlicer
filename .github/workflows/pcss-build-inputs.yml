name: PCSS build inputs
on:
  push:
    branches: [feature/pcss-editor-gcode-shadows]
    paths: [.github/workflows/pcss-build-inputs.yml]
permissions:
  contents: read
jobs:
  inputs:
    if: github.repository == 'PILIPALA030/OrcaSlicer' && github.ref == 'refs/heads/feature/pcss-editor-gcode-shadows'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install public test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libglew-dev libglfw3-dev libeigen3-dev glslang-tools clang-format
      - name: Collect headers, tools and tracked translations
        shell: python
        run: |
          import pathlib, subprocess, zipfile, re
          files = set()
          for directory in ('/usr/include/GL', '/usr/include/KHR', '/usr/include/GLFW', '/usr/include/eigen3'):
              files.update(p for p in pathlib.Path(directory).rglob('*') if p.is_file())
          for name in ('clang-format', 'glslangValidator'):
              executable = pathlib.Path(subprocess.check_output(['which', name]).decode().strip())
              files.add(executable)
              text = subprocess.check_output(['ldd', str(executable)]).decode()
              for library in re.findall(r'=> (/\S+)', text):
                  if 'LLVM' in library or 'clang' in library:
                      files.add(pathlib.Path(library))
          for pattern in ('libglfw.so*', 'libGLEW.so*'):
              files.update(pathlib.Path('/usr/lib/x86_64-linux-gnu').glob(pattern))
          with zipfile.ZipFile('pcss-build-inputs.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(files):
                  archive.write(path, str(path).lstrip('/'))
              for path in pathlib.Path('localization').rglob('*'):
                  if path.is_file():
                      archive.write(path, str(path))
      - uses: actions/upload-artifact@v4
        with:
          name: pcss-build-inputs
          path: pcss-build-inputs.zip
          retention-days: 3
