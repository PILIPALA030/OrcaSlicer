name: PCSS performance fix validation
on:
  push:
    branches: [feature/pcss-editor-gcode-shadows]
    paths: [.github/workflows/pcss-performance-fix.yml]
permissions:
  contents: read
concurrency:
  group: pcss-reviewed-performance-fix
  cancel-in-progress: false
jobs:
  validate-and-publish:
    if: github.repository == 'PILIPALA030/OrcaSlicer' && github.ref == 'refs/heads/feature/pcss-editor-gcode-shadows'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify the pinned input and apply the reviewed source changes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, gzip, hashlib, json, pathlib, subprocess
          expected = '0b53670909f8b5a25992ea85d399f2cb14a7a4cb'
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^']).decode().strip()
          assert parent == expected, 'Unexpected starting point; do not overwrite other work'
          blob = '40690bf274d8fed9495b28a9841b73e11e9c4acc'
          obj = json.loads(subprocess.check_output(['gh', 'api', 'repos/PILIPALA030/OrcaSlicer/git/blobs/' + blob]))
          encoded = base64.b64decode(obj['content'])
          assert hashlib.sha1(b'blob ' + str(len(encoded)).encode() + b'\0' + encoded).hexdigest() == blob
          script = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(script).hexdigest() == '4d960395cde6946a95641d003d87e511709a9aac91f4b1249bf20a134b6f83b4'
          pathlib.Path('/tmp/pcss-performance-fix.py').write_bytes(script)
          subprocess.run(['python3', '/tmp/pcss-performance-fix.py'], check=True)
      - name: Install isolated rendering test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libglew-dev libglfw3-dev libgl1-mesa-dev xvfb xauth clang-format
      - name: Format only changed regions and inspect the diff
        run: |
          set -o pipefail
          mkdir -p performance-results
          git diff --no-ext-diff --unified=0 -- '*.cpp' '*.hpp' | clang-format-diff-18 -p1 -i
          git add src/slic3r/GUI/3DScene.cpp src/slic3r/GUI/3DScene.hpp src/slic3r/GUI/GLCanvas3D.cpp
          git add src/slic3r/GUI/PCSSShadowMath.hpp src/slic3r/GUI/PCSSShadowRenderer.cpp src/slic3r/GUI/PCSSShadowRenderer.hpp
          git add resources/shaders/140/pcss.glsl resources/shaders/140/gouraud.fs resources/shaders/140/gouraud_light.fs
          git add tests/pcss/CMakeLists.txt tests/pcss/test_math.cpp tests/pcss/test_gl.cpp tests/pcss/test_integration.py tests/pcss/reference/pcss_before_performance.glsl
          git diff --cached --check
          git diff --cached --stat | tee performance-results/diff-stat.txt
          git diff --cached > performance-results/reviewed.diff
      - name: Build the shipping renderer with warnings as errors
        run: |
          set -o pipefail
          cmake -S tests/pcss -B build-pcss-perf -G Ninja -DPCSS_TEST_OPENGL=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS='-Wall -Wextra -Werror -pedantic' 2>&1 | tee performance-results/build-configure.log
          cmake --build build-pcss-perf --parallel 2 2>&1 | tee performance-results/build.log
      - name: Run regression tests and opt-in receiver A/B benchmark
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          MESA_GL_VERSION_OVERRIDE=3.1 MESA_GLSL_VERSION_OVERRIDE=140 xvfb-run -a ctest --test-dir build-pcss-perf --output-on-failure -V 2>&1 | tee performance-results/opengl31.log
          MESA_GL_VERSION_OVERRIDE=3.3 MESA_GLSL_VERSION_OVERRIDE=330 xvfb-run -a ./build-pcss-perf/pcss_gl_tests --core 2>&1 | tee performance-results/opengl33-core.log
          ORCA_PCSS_BENCHMARK=1 xvfb-run -a ./build-pcss-perf/pcss_gl_tests --core 2>&1 | tee performance-results/receiver-benchmark.log
      - name: Publish only after successful verification
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          branch=feature/pcss-editor-gcode-shadows
          remote_head=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$remote_head" = "$EXPECTED_HEAD" || { echo 'Concurrent branch update; refusing to overwrite'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf(rendering): share model LOD and avoid unnecessary PCSS sampling' -m 'Freeze the same available mesh before depth and color rendering, including partial-range and painted-mesh fallbacks. Include LOD identity in the shadow cache. Preserve the 2048 map and 16/32 samples, precompute Vogel offsets, cull only provably empty search footprints, and skip receivers with no main-light contribution. Add fixed-reference pixel comparisons and an opt-in controlled receiver benchmark.'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD > performance-results/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pcss-performance-validation
          path: performance-results
          retention-days: 14
          if-no-files-found: warn
